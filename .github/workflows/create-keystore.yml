name: Tao khoa JKS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Nhap CREATE de tao khoa moi"
        required: true
        type: string

jobs:
  create-key:
    if: inputs.confirm == 'CREATE'
    runs-on: ubuntu-latest

    steps:
      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tao khoa JKS
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$STORE_PASS" || exit 1
          keytool -genkeypair \
            -keystore release.jks \
            -storetype PKCS12 \
            -alias tuoiapp \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass:env STORE_PASS \
            -keypass:env STORE_PASS \
            -dname "CN=Tuoi Tu Dong Nghe An, O=Tuoi Tu Dong Nghe An, C=VN"

      - name: Luu khoa tam thoi
        uses: actions/upload-artifact@v4
        with:
          name: Khoa-JKS-Can-Bao-Mat
          path: release.jks
          retention-days: 1
